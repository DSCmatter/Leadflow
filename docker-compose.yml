name: leadflow

services:
  backend:
    build:
      context: ./backend
    image: leadflow-backend
    environment:
      DATABASE_PATH: /app/data/leadflow.db
      CORS_ORIGINS: http://localhost:3000
      # Autter Runtime: OTLP/HTTP to the hosted ingester (see .env.example).
      AUTTER_RUNTIME_KEY: ${AUTTER_RUNTIME_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.autter.dev
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${AUTTER_RUNTIME_KEY:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: leadflow-api
      OTEL_RESOURCE_ATTRIBUTES: service.version=${GIT_SHA:-dev},deployment.environment=development
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.01"
    ports:
      - "8000:8000"
    volumes:
      - leadflow-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: leadflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-only key: read by the relay route and registerAutter.
      AUTTER_RUNTIME_KEY: ${AUTTER_RUNTIME_KEY:-}
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  leadflow-data:
